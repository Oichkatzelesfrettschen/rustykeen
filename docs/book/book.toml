[book]
title = "Rustykeen: Comprehensive KenKen Solver Documentation"
description = "Complete guide to building, using, and extending the Rustykeen puzzle solver"
authors = ["Eirik Rasmusen"]
language = "en"
src = "."

[build]
build-dir = "../build"

[output.html]
theme = "light"
default-theme = "light"
preferred-dark-theme = "dark"
mathjax-support = false

[output.html.search]
enable = true
limit-results = 30
