[workspace]
members = [
  "kenken-cli",
  "kenken-core",
  "kenken-cvd",
  "kenken-gen",
  "kenken-io",
  "kenken-simd",
  "kenken-sdl2",
  "kenken-solver",
  "kenken-ui",
  "kenken-uniffi",
  "kenken-verify",
  "kenken-wasm",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "GPL-2.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
rand = "0.10"
rand_chacha = "0.10"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-flame = "0.2"
fixedbitset = "0.5"
criterion = { version = "0.8", default-features = false, features = ["rayon"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 1
debug = 0
incremental = true
